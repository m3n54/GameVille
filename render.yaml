services:
  - type: web
    name: gameville-server
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server/src/index.js
    envVars:
      - key: PORT
        value: 3001
      # Comma-separated origins. Wildcard suffix `https://*.vercel.app` is supported
      # by the server's `isOriginAllowed` matcher — covers every preview deployment
      # without enumerating each branch URL.
      - key: CORS_ORIGIN
        value: https://gameville.vercel.app,https://*.vercel.app
    healthCheckPath: /health
